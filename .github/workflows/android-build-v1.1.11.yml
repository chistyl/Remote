name: TV Remote v1.1.12 native build

on:
  workflow_dispatch:
  push:
    branches: [ work/tvremote-v1.1.11-native, work/tvremote-v1.1.12-five-features ]
    paths:
      - 'TVRemote_New/**'
      - '.github/workflows/android-build-v1.1.11.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.1.12 source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        working-directory: TVRemote_New
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        working-directory: TVRemote_New
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK and calculate SHA-256
        working-directory: TVRemote_New
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Package complete source ZIP
        run: |
          cd TVRemote_New
          zip -r ../TVRemote-v1.1.12-source.zip . -x "*/build/*" ".gradle/*"
          test -s ../TVRemote-v1.1.12-source.zip
      - name: Upload v1.1.12 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-v1.1.12-debug
          path: TVRemote_New/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload v1.1.12 complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-v1.1.12-source
          path: TVRemote-v1.1.12-source.zip
          if-no-files-found: error
