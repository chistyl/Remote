name: TV Remote touchpad build

on:
  workflow_dispatch:
  push:
    branches: [ feature/third-page-touchpad-730b879 ]
    paths:
      - 'TVRemote_New/**'
      - '.github/workflows/touchpad-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout touchpad source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        working-directory: TVRemote_New
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        working-directory: TVRemote_New
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK and calculate SHA-256
        working-directory: TVRemote_New
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-touchpad-debug
          path: TVRemote_New/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-touchpad-source
          path: TVRemote_New/
          if-no-files-found: error
