name: TV Remote touchpad v1.1.16 validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ work/tvremote-v1.1.15-three-page-remote ]
    paths:
      - 'TVRemote_New/**'
      - '.github/workflows/touchpad-v1.1.16.yml'
  push:
    branches: [ feature/touchpad-v1.1.16 ]
    paths:
      - 'TVRemote_New/**'
      - '.github/workflows/touchpad-v1.1.16.yml'

permissions:
  contents: read

concurrency:
  group: tvremote-touchpad-v1.1.16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout touchpad source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run unit tests
        working-directory: TVRemote_New
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        working-directory: TVRemote_New
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        working-directory: TVRemote_New
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Package complete source ZIP
        run: |
          cd TVRemote_New
          zip -r ../TVRemote-v1.1.16-touchpad-source.zip . -x "*/build/*" ".gradle/*"
          test -s ../TVRemote-v1.1.16-touchpad-source.zip
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-v1.1.16-touchpad-debug
          path: TVRemote_New/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-v1.1.16-touchpad-source
          path: TVRemote-v1.1.16-touchpad-source.zip
          if-no-files-found: error
