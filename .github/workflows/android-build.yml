name: Android APK Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-build.yml"
      - "GoogleTVRemote-source.zip"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build CHI TV Remote v0.6.6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q GoogleTVRemote-source.zip
          test -f GoogleTVRemote/app/build.gradle.kts
          test -f GoogleTVRemote/settings.gradle.kts

      - name: Package extracted source for UI integration review
        run: |
          zip -qr /tmp/CHI-TV-Remote-source-review.zip GoogleTVRemote

      - name: Upload extracted source review
        uses: actions/upload-artifact@v4
        with:
          name: CHI-TV-Remote-source-review
          path: /tmp/CHI-TV-Remote-source-review.zip
          if-no-files-found: error
          retention-days: 3

      - name: Apply startup crash fix
        run: |
          TARGET="GoogleTVRemote/app/src/main/java/com/chi/tvremote/protocol"
          cp patches/ClientIdentity.kt "$TARGET/ClientIdentity.kt"
          cp patches/TvPairingClient.kt "$TARGET/TvPairingClient.kt"
          cp patches/TvRemoteClient.kt "$TARGET/TvRemoteClient.kt"
          cp patches/AppLanguageSettings.kt GoogleTVRemote/app/src/main/java/com/chi/tvremote/AppLanguageSettings.kt
          sed -i 's/versionCode = 6/versionCode = 12/' GoogleTVRemote/app/build.gradle.kts
          sed -i 's/versionName = "0.6.0"/versionName = "0.6.6"/' GoogleTVRemote/app/build.gradle.kts

      - name: Integrate language settings navigation
        working-directory: GoogleTVRemote
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/chi/tvremote/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old_nav = '            NavigationBarItem(selected = tab == 2, onClick = { tab = 2 }, icon = { Icon(Icons.Default.Tv, null) }, label = { Text("設備") })'
          new_nav = old_nav + '\n            NavigationBarItem(selected = tab == 3, onClick = { tab = 3 }, icon = { Icon(Icons.Default.Settings, null) }, label = { Text("設定") })'
          if old_nav not in s:
              raise SystemExit("Could not locate device navigation item")
          s = s.replace(old_nav, new_nav, 1)
          old_branch = '                else -> DeviceScreen('
          new_branch = '                3 -> LanguageSettingsScreen()\n                2 -> DeviceScreen('
          if old_branch not in s:
              raise SystemExit("Could not locate device screen branch")
          s = s.replace(old_branch, new_branch, 1)
          p.write_text(s, encoding="utf-8")
          print("Added Settings tab and seven-language preference screen.")
          PY

      - name: Apply language selection context
        run: python3 patches/ApplyLanguageContext.py

      - name: Apply interactive button feedback
        run: python3 patches/EnableInteractiveFeedback.py

      - name: Apply pairing button feedback
        run: python3 patches/EnablePairingFeedback.py

      - name: Apply black and white launcher icon
        run: python3 patches/icon/apply_launcher_icon.py

      - name: Fix Compose pointer API imports
        working-directory: GoogleTVRemote
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("app/src/main/java/com/chi/tvremote/MainActivity.kt")
          text = source.read_text(encoding="utf-8")
          invalid_imports = (
              "import androidx.compose.ui.input.pointer.consume",
              "import androidx.compose.ui.input.pointer.awaitPointerEvent",
          )
          lines = text.splitlines(keepends=True)
          removed = [line.strip() for line in lines if line.strip() in invalid_imports]
          if len(removed) != len(invalid_imports):
              raise SystemExit(f"Expected both invalid imports, found: {removed}")
          text = "".join(line for line in lines if line.strip() not in invalid_imports)
          source.write_text(text, encoding="utf-8")
          print("Removed invalid top-level imports; consume() and awaitPointerEvent() are scope/member APIs.")

          gradle_file = Path("app/build.gradle.kts")
          gradle_text = gradle_file.read_text(encoding="utf-8")
          exclude_path = "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
          if exclude_path not in gradle_text:
              marker = "android {"
              if marker not in gradle_text:
                  raise SystemExit("Could not find android { block in app/build.gradle.kts")
              gradle_text = gradle_text.replace(
                  marker,
                  marker + "\n    packaging {\n        resources {\n            excludes += \"" + exclude_path + "\"\n        }\n    }",
                  1,
              )
              gradle_file.write_text(gradle_text, encoding="utf-8")
          print("Added Android packaging exclusion for duplicate Bouncy Castle OSGI manifest.")
          PY

      - name: Build debug APK
        working-directory: GoogleTVRemote
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHI-TV-Remote-v0.6.6-debug
          path: GoogleTVRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
