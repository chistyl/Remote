name: Android APK Build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-build.yml"
      - "GoogleTVRemote-source.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build CHI TV Remote v0.6.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q GoogleTVRemote-source.zip
          test -f GoogleTVRemote/app/build.gradle.kts
          test -f GoogleTVRemote/settings.gradle.kts

      - name: Build debug APK
        working-directory: GoogleTVRemote
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHI-TV-Remote-v0.6.0-debug
          path: GoogleTVRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
